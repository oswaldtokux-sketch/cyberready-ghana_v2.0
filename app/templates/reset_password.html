<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Choose password - CyberReady Ghana</title><link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"></head>
<body><nav><a href="{{ url_for('main.home') }}" class="logo">CyberReady <span>Ghana</span></a></nav><section><div class="section-title"><h2>Choose a new password</h2><p>Use 12+ characters, upper- and lowercase letters, a number, and a symbol.</p></div>{% with messages = get_flashed_messages() %}{% for message in messages %}<div class="flash-message">{{ message }}</div>{% endfor %}{% endwith %}<div class="form-container"><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="form-group"><label for="password">New password</label><input id="password" name="password" type="password" minlength="12" required autocomplete="new-password"></div><div class="form-group"><label for="confirm_password">Confirm new password</label><input id="confirm_password" name="confirm_password" type="password" minlength="12" required autocomplete="new-password"></div><button class="btn" type="submit">Reset password</button></form></div></section><footer><p>Â© 2026 CyberReady Ghana. Cybersecurity made practical.</p></footer></body></html>
